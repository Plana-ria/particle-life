name: Test Particle Life
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run physics tests
        run: node --test tests/*.test.mjs
      - name: Run convergence comparisons (one-off benchmark)
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Run convergence comparisons')
        run: node tests/benchmark.mjs
      - name: Long-term convergence experiment
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Improve RGB physics')
        timeout-minutes: 20
        run: node tests/long-benchmark.mjs
      - name: Check JavaScript syntax
        run: |
          node --check shared/engine.js
          node --check shared/app.js
          node --check shared/camera.js
          node --check shared/classic-camera.js
          node --check shared/classic-gpu.js
          node --check shared/classic-app.js
