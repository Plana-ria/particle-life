name: Test Particle Life
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run physics tests
        run: node --test tests/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check shared/engine.js
          node --check shared/app.js
          node --check shared/camera.js
